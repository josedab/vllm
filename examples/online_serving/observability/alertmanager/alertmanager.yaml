# Alertmanager configuration for vLLM alerts
global:
  # The smarthost and SMTP sender used for mail notifications
  # smtp_smarthost: 'smtp.example.org:587'
  # smtp_from: 'alertmanager@example.org'
  # smtp_auth_username: 'alertmanager'
  # smtp_auth_password: 'password'

  # Slack API URL for notifications
  # slack_api_url: 'https://hooks.slack.com/services/xxx/xxx/xxx'

  resolve_timeout: 5m

# Route tree
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

  routes:
    # Critical alerts - notify immediately
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 1m
      repeat_interval: 4h

# Receivers
receivers:
  - name: 'default'
    # Configure your notification channel here
    # webhook_configs:
    #   - url: 'http://localhost:5001/'

  - name: 'critical'
    # Slack notification for critical alerts
    # slack_configs:
    #   - channel: '#vllm-alerts-critical'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
    #     send_resolved: true

    # PagerDuty for critical alerts
    # pagerduty_configs:
    #   - service_key: '<service-key>'
    #     severity: critical

  - name: 'warning'
    # Slack notification for warnings
    # slack_configs:
    #   - channel: '#vllm-alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
    #     send_resolved: true

# Inhibition rules
inhibit_rules:
  # If a critical alert is firing, inhibit warning alerts for the same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
