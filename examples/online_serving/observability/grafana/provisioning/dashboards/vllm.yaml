# Grafana dashboard provisioning for vLLM
apiVersion: 1

providers:
  - name: 'vLLM Dashboards'
    orgId: 1
    folder: 'vLLM'
    folderUid: 'vllm'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
